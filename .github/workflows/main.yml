name: Deploy Jekyll site to Pages 2

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev zlib1g-dev libreadline-dev \
                                  libyaml-dev libsqlite3-dev sqlite3 libxml2-dev libxslt-dev \
                                  autoconf bison libgmp-dev libgdbm-dev libncurses5-dev \
                                  libffi-dev libtool pkg-config openssl make gcc

      - name: Install ruby-build
        run: |
          git clone https://github.com/rbenv/ruby-build.git
          sudo PREFIX=/usr/local ./ruby-build/install.sh

      - name: Install Ruby 3.1.4
        run: |
          ruby-build 3.1.4 /opt/hostedtoolcache/Ruby/3.1.4/x64
          touch /opt/hostedtoolcache/Ruby/3.1.4/x64.complete

      - name: Setup Ruby Environment
        run: |
          echo 'export PATH=/opt/hostedtoolcache/Ruby/3.1.4/x64/bin:$PATH' >> $GITHUB_ENV
          echo 'export GEM_HOME=$HOME/.gem' >> $GITHUB_ENV
          echo 'export PATH=$GEM_HOME/bin:$PATH' >> $GITHUB_ENV

      - name: Install Bundler
        run: |
          gem install bundler:2.3.4

      - name: Install Dependencies
        run: |
          bundle install
        env:
          PATH: ${{ env.PATH }}

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Build with Jekyll
        run: |
          bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
